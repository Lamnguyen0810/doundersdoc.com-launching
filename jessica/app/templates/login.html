{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="card" style="max-width:440px;margin:40px auto">
  <h1 style="font-size:24px">Sign in</h1>
  <p class="muted">We'll email you a link. No password.</p>
  <form id="magic" style="margin-top:16px">
    <input type="email" id="email" placeholder="you@company.com" required style="font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;width:100%">
    <button class="btn" type="submit" style="margin-top:12px;width:100%;justify-content:center">Send link</button>
  </form>
  <p id="msg" class="muted" style="margin-top:12px"></p>
</div>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const sb = createClient("{{ supabase_url }}", "{{ supabase_anon_key }}");
const msg = document.getElementById("msg");

// 1. Returning from the magic link: exchange the session for our httpOnly cookie.
const { data: { session } } = await sb.auth.getSession();
if (session) {
  const r = await fetch("/auth/session", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ access_token: session.access_token }) });
  if (r.ok) location.replace("/");
}

// 2. Otherwise send the link.
document.getElementById("magic").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value;
  const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + "/auth/login" } });
  msg.textContent = error ? error.message : "Check your inbox for the sign-in link.";
});
</script>
{% endblock %}
