<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}FD AI{% endblock %} · Founders Doc</title>
<script src="https://unpkg.com/htmx.org@2.0.4"></script>
<style>
:root{--bg:#fafaf8;--card:#fff;--ink:#0a0a0a;--muted:#6b6b6b;--line:#e4e4dc;--high:#b3261e;--med:#8a5a1c;--low:#1f4d36}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
nav{border-bottom:1px solid var(--line);background:var(--bg)}
.nav{max-width:1100px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;gap:9px;align-items:center;font-weight:600;text-decoration:none}
.logo i{width:24px;height:24px;border-radius:6px;background:var(--ink);color:#fff;font-size:11px;display:grid;place-items:center;font-style:normal}
.wrap{max-width:1100px;margin:0 auto;padding:36px 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:#fff;font:inherit;font-weight:500;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink)}
.muted{color:var(--muted)}
h1{font-size:30px;letter-spacing:-.02em;font-weight:600;margin-bottom:8px}
h2{font-size:20px;font-weight:600;margin:28px 0 12px}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:38px 24px;text-align:center;background:var(--bg)}
input[type=text],select,textarea{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;width:100%;background:#fff}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.sev{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.sev.high{color:var(--high)}.sev.medium{color:var(--med)}.sev.low{color:var(--low)}
.grade{font-size:56px;font-weight:600;letter-spacing:-.04em;line-height:1}
pre{white-space:pre-wrap;font:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:16px}
.turn{padding:12px 0;border-bottom:1px solid var(--line)}
.turn b{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.htmx-indicator{display:none}.htmx-request .htmx-indicator{display:inline}
</style>
</head>
<body>
<nav><div class="nav">
  <a class="logo" href="/"><i>fd</i>FD AI</a>
  <div class="row">
    {% if principal and principal.is_authenticated %}
      <span class="muted">{{ principal.user.email }}</span>
      <form method="post" action="/auth/logout"><button class="btn ghost" type="submit">Sign out</button></form>
    {% else %}
      <a class="btn ghost" href="/auth/login">Sign in</a>
    {% endif %}
  </div>
</div></nav>
<main class="wrap">{% block content %}{% endblock %}</main>
</body>
</html>
